name: Publish release
on:
  workflow_call:
    inputs:
      release-app-id:
        description: App ID of the release GitHub App
        type: string
        required: true
      version:
        description: version output of release-check.yml, which the caller runs first
        type: string
        required: true
      tag:
        description: tag output of release-check.yml. Created here, on the commit being released, after every artifact is published.
        type: string
        required: true
      images:
        description: JSON list of pushed image references to attach SBOMs for
        type: string
        default: "[]"
      changelog:
        description: Keep a Changelog file whose section for this version becomes the notes. Empty generates notes from commits.
        type: string
        default: ""
      artifacts:
        description: Artifact name pattern from earlier jobs in this run, downloaded into dist/
        type: string
        default: ""
      assets:
        description: Glob of files attached to the release, relative to the repository root
        type: string
        default: ""
      registry:
        description: Registry to log in to before generating image SBOMs, used only when registry-token is passed
        type: string
        default: docker.io
      registry-username:
        description: Username for the registry login
        type: string
        default: ""
    secrets:
      registry-token:
        description: Token for pulling private images; omit for public images
        required: false
      release-app-key:
        description: Private key of the release GitHub App, the only actor the tag rulesets let create a v* tag
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.release-app-id }}
          private-key: ${{ secrets.release-app-key }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - if: inputs.artifacts != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifacts }}
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom/${{ github.event.repository.name }}-${{ inputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
          ASSETS: ${{ inputs.assets }}
        run: |
          flags=(--target "$GITHUB_SHA")
          if [ -n "$CHANGELOG" ]; then
            uv run --no-project --with packaging --with pyyaml python .shared/scripts/manifest.py notes "$CHANGELOG" "$VERSION" > "$RUNNER_TEMP/notes.md"
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            flags+=(--generate-notes)
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}"
          shopt -s globstar nullglob
          files=(sbom/*.spdx.json)
          for asset in $ASSETS; do files+=("$asset"); done
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  image-sbom:
    if: inputs.images != '[]'
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - id: name
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ inputs.tag }}
        run: echo "file=$(tr '/:@' '___' <<<"$IMAGE")-${TAG}.spdx.json" >> "$GITHUB_OUTPUT"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.release-app-id }}
          private-key: ${{ secrets.release-app-key }}
          permission-contents: write
      - id: auth
        env:
          TOKEN: ${{ secrets.registry-token }}
        run: echo "login=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.auth.outputs.login == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-token }}
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          output-file: ${{ steps.name.outputs.file }}
          upload-artifact: false
          upload-release-assets: false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ inputs.tag }}
          FILE: ${{ steps.name.outputs.file }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$FILE"
