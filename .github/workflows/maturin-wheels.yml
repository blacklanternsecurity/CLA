name: Maturin wheels
on:
  workflow_call:
    inputs:
      targets:
        description: JSON object of maturin targets per platform family in FAMILIES. Override to drop targets a crate cannot build.
        type: string
        default: '{"linux": ["x86_64", "x86", "aarch64", "armv7", "s390x", "ppc64le"], "musllinux": ["x86_64", "x86", "aarch64", "armv7"], "windows": ["x64", "x86"], "macos": ["x86_64", "aarch64"]}'
      manylinux:
        description: manylinux policy for the linux family
        type: string
        default: "2_28"
      before-script-linux:
        description: Repository script sourced inside the linux and musllinux build containers. Its exports reach maturin.
        type: string
        default: ""
      env:
        description: JSON object of plain environment variables for every build
        type: string
        default: "{}"
    outputs:
      artifacts:
        description: Artifact name pattern covering every wheel and the sdist
        value: wheels-*

permissions:
  contents: read

jobs:
  python:
    uses: $/.github/workflows/python-versions.yml

  plan:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          MANYLINUX: ${{ inputs.manylinux }}
          FAMILIES: |
            {
              "linux": {"runner": {"*": "ubuntu-24.04"}, "container": true},
              "musllinux": {"runner": {"*": "ubuntu-24.04"}, "manylinux": "musllinux_1_2", "container": true},
              "windows": {"runner": {"*": "windows-2025"}, "manylinux": "", "container": false, "architecture": true},
              "macos": {"runner": {"x86_64": "macos-15-intel", "aarch64": "macos-15"}, "manylinux": "", "container": false}
            }
        run: |
          builds=$(jq -c --argjson families "$FAMILIES" --arg manylinux "$MANYLINUX" '
            [to_entries[] | .key as $family | ($families[$family] // error("unknown family \($family)")) as $f | .value[] | {
              family: $family,
              target: .,
              runner: ($f.runner[.] // $f.runner["*"] // error("no runner for \($family) \(.)")),
              manylinux: ($f.manylinux // $manylinux),
              container: $f.container,
              architecture: (if $f.architecture then . else "" end)
            }]' <<<"$TARGETS")
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  wheel:
    needs: [python, plan]
    runs-on: ${{ matrix.build.runner }}
    strategy:
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    env: ${{ fromJSON(inputs.env) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: args
        shell: bash
        env:
          VERSIONS: ${{ needs.python.outputs.versions }}
          BEFORE: ${{ inputs.before-script-linux }}
        run: |
          {
            echo "interpreters=$(jq -r 'map("-i python" + .) | join(" ")' <<<"$VERSIONS")"
            echo "setup<<EOF"
            jq -r '.[]' <<<"$VERSIONS"
            echo "EOF"
            echo "before=${BEFORE:+source ./$BEFORE}"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ !matrix.build.container }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.args.outputs.setup }}
          architecture: ${{ matrix.build.architecture }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.build.target }}
          args: --release --locked --out dist ${{ steps.args.outputs.interpreters }}
          sccache: false
          manylinux: ${{ matrix.build.manylinux }}
          before-script-linux: ${{ steps.args.outputs.before }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.build.family }}-${{ matrix.build.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist
