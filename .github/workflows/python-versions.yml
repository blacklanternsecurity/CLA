name: Python versions
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
    outputs:
      versions:
        description: JSON list of released CPython minors that satisfy the manifest's requires-python
        value: ${{ jobs.read.outputs.versions }}
      maturin:
        description: true when the build backend is maturin
        value: ${{ jobs.read.outputs.maturin }}

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      maturin: ${{ steps.read.outputs.maturin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: read
        env:
          ROOT: ${{ inputs.working-directory }}
        run: uv run --no-project --with packaging --with pyyaml python .shared/scripts/manifest.py --root "$ROOT" matrix
