name: Docker
on:
  workflow_call:
    inputs:
      image:
        description: Registry repository, such as blacklanternsecurity/bbot
        type: string
        required: true
      version:
        description: version output of release-check.yml
        type: string
        required: true
      prerelease:
        type: string
        required: true
      major:
        type: string
        required: true
      minor:
        type: string
        required: true
      description:
        description: Push README.md to the Docker Hub repository description
        type: boolean
        default: false
    outputs:
      images:
        description: JSON list of pushed version references, for publish.yml images
        value: ${{ jobs.plan.outputs.images }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.read.outputs.builds }}
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: read
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: uv run --no-project --with packaging --with pyyaml python .shared/scripts/manifest.py images "$IMAGE" "$VERSION"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      RELEASE: ${{ inputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.build.suffix }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=dev,enable=${{ env.RELEASE == 'false' }}
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=raw,value=stable,enable=${{ env.RELEASE }}
            type=raw,value=${{ inputs.major }}.${{ inputs.minor }},enable=${{ env.RELEASE }}
            type=raw,value=${{ inputs.major }},enable=${{ env.RELEASE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.build.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.build.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.build.file }}

  description:
    if: inputs.description
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ inputs.image }}
