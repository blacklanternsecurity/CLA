name: Release check
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      direct-push-paths:
        description: >-
          Space-separated paths a commit that didn't arrive through a merged pull request may touch
          (cloudcheck's daily data files). Empty, the default: every commit since the last release
          must come through a merged pull request.
        type: string
        default: ""
      check-script:
        description: Repository script and arguments, run with the tag appended, for versions stated outside the manifest
        type: string
        default: ""
      image:
        description: Docker Hub repository this release pushes, so a version already pushed without its tag is caught
        type: string
        default: ""
    secrets:
      BLS_RELEASE_PRIVATE_KEY:
        description: Never passed by a caller. Declared so the release environment's secret of this name resolves.
        required: false
    outputs:
      version:
        description: Manifest version of the merged commit. Every tracked Helm Chart.yaml version and appVersion must equal it.
        value: ${{ jobs.check.outputs.version }}
      tag:
        description: v<version>, created by publish.yml once everything is published
        value: ${{ jobs.check.outputs.tag }}
      major:
        value: ${{ jobs.check.outputs.major }}
      minor:
        value: ${{ jobs.check.outputs.minor }}
      release:
        description: false when the v<version> tag already exists, so a push that keeps the version publishes nothing
        value: ${{ jobs.check.outputs.release }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      tag: ${{ steps.manifest.outputs.tag }}
      major: ${{ steps.manifest.outputs.major }}
      minor: ${{ steps.manifest.outputs.minor }}
      release: ${{ steps.new.outputs.release }}
    steps:
      - if: github.ref != 'refs/heads/stable'
        run: |
          echo "::error::releases run from stable only"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: manifest
        env:
          ROOT: ${{ inputs.working-directory }}
        run: uv run --no-project --with packaging --with pyyaml python .shared/scripts/manifest.py --root "$ROOT" release
      - if: inputs.check-script != ''
        env:
          SCRIPT: ${{ inputs.check-script }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          read -ra cmd <<<"$SCRIPT"
          "./${cmd[0]}" "${cmd[@]:1}" "$TAG"
      - id: new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.manifest.outputs.version }}
          PYPI_NAME: ${{ steps.manifest.outputs.pypi_name }}
          CRATE_NAME: ${{ steps.manifest.outputs.crate_name }}
          IMAGE: ${{ inputs.image }}
        run: |
          status=$(gh api -i "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null | head -1 | cut -d' ' -f2 || true)
          if [ "$status" = 200 ]; then
            echo "::notice::$TAG exists, nothing to publish"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" != 404 ]; then
            echo "::error::could not read tag $TAG (HTTP ${status:-none})"
            exit 1
          fi
          registry() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY" "$1")
            case "$code" in
              200) found+=("$2") ;;
              404) ;;
              *) echo "::error::could not query $2 (HTTP $code)"; exit 1 ;;
            esac
          }
          found=()
          [ -z "$PYPI_NAME" ] || registry "https://pypi.org/pypi/$PYPI_NAME/$VERSION/json" PyPI
          [ -z "$CRATE_NAME" ] || registry "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" crates.io
          [ -z "$IMAGE" ] || registry "https://hub.docker.com/v2/repositories/$IMAGE/tags/$VERSION" "Docker Hub"
          if [ ${#found[@]} -gt 0 ]; then
            echo "::error::$TAG is partly published from another run (${found[*]}); re-run that run or bump the version"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      # Judged by PR association, not commit author, which anyone can set.
      - if: steps.new.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ inputs.working-directory }}
          ALLOW: ${{ inputs.direct-push-paths }}
        run: |
          read -ra allow <<<"$ALLOW"
          python3 .shared/scripts/provenance.py --root "$ROOT" --repo "$GITHUB_REPOSITORY" --allow "${allow[@]}"
      # GitHub auto-creates a missing environment unprotected; Team-plan private repos can't have reviewers.
      - if: steps.new.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          fail() { echo "::error::release environment: $1"; exit 1; }
          env_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" 2>&1) || fail "can't be read ($env_json). Create and protect it before releasing."
          [ "$(jq -r '.can_admins_bypass' <<<"$env_json")" = "false" ] || fail "admins can bypass it; turn that off"
          [ "$(jq -r '.deployment_branch_policy.custom_branch_policies' <<<"$env_json")" = "true" ] || fail "deployments aren't limited to selected branches"
          policies=$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | sort | join(",")') || fail "its branch policies can't be read"
          [ "$policies" = "branch:stable" ] || fail "it must allow the stable branch only, not '$policies'"
          if [ "$PRIVATE" != "true" ]; then
            reviewers=$(jq '[.protection_rules[] | select(.type == "required_reviewers")][0]' <<<"$env_json")
            [ "$(jq '.reviewers | length' <<<"$reviewers")" -gt 0 ] 2>/dev/null || fail "it has no required reviewers"
            [ "$(jq -r '.prevent_self_review' <<<"$reviewers")" = "true" ] || fail "prevent self-review is off"
          fi
          echo "::notice::release environment is protected"

  credentials:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BLS_RELEASE_APP_ID }}
          private-key: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}
          permission-contents: write
