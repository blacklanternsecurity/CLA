name: Release check
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      check-script:
        description: Extra repository script run with the tag as its argument, for versions stated outside the manifest
        type: string
        default: ""
    outputs:
      version:
        description: Manifest version, equal to the tag. Every tracked Helm Chart.yaml version and appVersion must equal it too.
        value: ${{ jobs.check.outputs.version }}
      prerelease:
        description: true for vX.Y.Z-rc.N tags
        value: ${{ jobs.check.outputs.prerelease }}
      semver:
        description: The tag without its v prefix
        value: ${{ jobs.check.outputs.semver }}
      major:
        value: ${{ jobs.check.outputs.major }}
      minor:
        value: ${{ jobs.check.outputs.minor }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      semver: ${{ steps.tag.outputs.semver }}
      major: ${{ steps.tag.outputs.major }}
      minor: ${{ steps.tag.outputs.minor }}
    steps:
      - if: github.ref_type != 'tag'
        run: |
          echo "::error::releases run on tag pushes only"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: tag
        env:
          ROOT: ${{ inputs.working-directory }}
          TAG: ${{ github.ref_name }}
        run: uv run --no-project --with packaging python .shared/scripts/manifest.py --root "$ROOT" tag "$TAG"
      - if: inputs.check-script != ''
        env:
          SCRIPT: ${{ inputs.check-script }}
          TAG: ${{ github.ref_name }}
        run: '"./$SCRIPT" "$TAG"'
