name: crates.io
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      setup-script:
        description: Repository script run before cargo publish. It may append to $GITHUB_ENV.
        type: string
        default: ""
      version:
        description: version output of release-check.yml
        type: string
        required: true

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - id: published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r --arg m "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $m) | .name')
          if [ -z "$crate" ]; then
            echo "::error::no [package] in $PWD/Cargo.toml"
            exit 1
          fi
          if curl -sf -o /dev/null -H "User-Agent: $GITHUB_REPOSITORY" "https://crates.io/api/v1/crates/$crate/$VERSION"; then
            echo "::notice::$crate $VERSION is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true' && inputs.setup-script != ''
        env:
          SCRIPT: ${{ inputs.setup-script }}
        run: '"./$SCRIPT"'
      - if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
